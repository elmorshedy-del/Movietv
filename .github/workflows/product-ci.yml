name: Product CI

on:
  workflow_dispatch:
  push:
    branches: [main, live-tv-product]
    paths:
      - "client/**"
      - "server/**"
      - "shared/**"
      - "netlify/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.config.ts"
      - ".github/workflows/product-ci.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Production build
        run: pnpm build

  iptv-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Start app with API middleware
        run: |
          nohup pnpm exec vite --host 127.0.0.1 --port 4173 --strictPort > /tmp/movietv.log 2>&1 &
          for i in {1..40}; do
            if curl --silent --fail http://127.0.0.1:4173/api/ping > /dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/movietv.log
          exit 1
      - name: Resolve complete curated catalog
        run: |
          curl --silent --fail http://127.0.0.1:4173/api/tv/home > /tmp/home.json
          curl --silent --fail http://127.0.0.1:4173/api/tv/section/all > /tmp/all.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const home = JSON.parse(fs.readFileSync('/tmp/home.json', 'utf8'));
          const all = JSON.parse(fs.readFileSync('/tmp/all.json', 'utf8'));
          if (!home.ok || !all.ok) throw new Error('TV metadata API not ok');

          const live = home.rows.filter(r => r.kind === 'channels').flatMap(r => r.items || []);
          if (live.length < 10) throw new Error(`too few home channels resolved: ${live.length}`);
          if (all.channels.length < 25) throw new Error(`too few total curated channels resolved: ${all.channels.length}`);
          if (all.missingChannels.length) {
            throw new Error(`active curated channels missing from provider catalog: ${all.missingChannels.join(', ')}`);
          }

          console.log(`home: ${live.length} channels resolved`);
          console.log(`all curated: ${all.channels.length} channels resolved`);
          console.log('active curated catalog coverage: complete');
          NODE
      - name: Mint playback sources across product sections
        run: |
          for CHANNEL_ID in hbo rotana-cinema-eg el-hiwar fashion-tv; do
            curl --silent --fail "http://127.0.0.1:4173/api/tv/channel/${CHANNEL_ID}" > "/tmp/playback-${CHANNEL_ID}.json"
            CHANNEL_ID="$CHANNEL_ID" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const id = process.env.CHANNEL_ID;
          const data = JSON.parse(fs.readFileSync(`/tmp/playback-${id}.json`, 'utf8'));
          if (!data.ok || (!data.playbackUrl && !data.tsPlaybackUrl)) {
            throw new Error(`playback API did not return a source for ${id}`);
          }
          if (!data.channel?.available || data.variantCount < 1) {
            throw new Error(`invalid playback metadata for ${id}`);
          }
          console.log(`playback source ok: ${data.channel.label} (${data.variantCount} variant(s))`);
          NODE
          done
