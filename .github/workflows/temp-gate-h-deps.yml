name: Temporary Gate H dependency generator

on:
  push:
    branches:
      - watch-together-gate-h

permissions:
  contents: write

jobs:
  generate:
    if: github.event.head_commit.message != 'Gate H deps generated'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: watch-together-gate-h
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm add socket.io@4
      - run: pnpm add -D socket.io-client@4
      - name: Commit generated manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git commit -m "Gate H deps generated"
          git push origin HEAD:watch-together-gate-h
